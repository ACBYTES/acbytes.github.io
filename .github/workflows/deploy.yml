name: Deploy to GitHub Pages

on:
  push:
    branches: [ next ]
  pull_request:
    branches: [ next ]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        cache: 'npm'

    - name: Install dependencies
      run: npm ci --legacy-peer-deps

    - name: Build
      run: npm run build

    # Copy static folders to `out/`
    - name: Copy static folders to out/
      run: |
        cp -r ./Software ./out/

    # Copy sitemap.txt to `out/`
    - name: Copy sitemap.txt to out/
      run: |
        cp ./sitemap.txt ./out/
        cp ./CNAME ./out/

    - name: Deploy to GitHub Pages
      if: github.ref == 'refs/heads/next'
      uses: peaceiris/actions-gh-pages@v3
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        publish_dir: ./out
